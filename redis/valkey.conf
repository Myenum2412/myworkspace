# MyWorkSpace Valkey Production Configuration
# This file replaces the legacy Redis configuration. Valkey is wire-compatible
# with the Redis protocol (RESP), so the existing ioredis clients and the
# REDIS_URL=redis://redis:6379 connection string continue to work unchanged.

# ── Persistence (RDB snapshots) ──
# NOTE: no inline comments after `save` arguments — Valkey parses `save` as a
# variadic directive and trailing tokens are interpreted as save parameters.
save 900 1
save 300 10
save 60 10000

# AOF persistence (append-only log)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Memory Management ──
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ── Networking ──
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── Security ──
# Rename dangerous commands for hardened environments (uncomment as needed).
# Keep CONFIG reachable so the valkey-backup.sh script can read paths.
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
# rename-command KEYS ""
# Optional: set an auth password in production.
# requirepass ${VALKEY_PASSWORD}

# ── Limits ──
maxclients 10000

# ── Logging ──
loglevel notice
logfile ""

# ── Slow Log ──
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency Monitoring ──
latency-monitor-threshold 100

# ── Keyspace Notifications (for cache invalidation) ──
notify-keyspace-events Ex
