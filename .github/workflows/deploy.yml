name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy"
        required: false
        type: string
      skip_verify:
        description: "Skip post-deployment verification"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: TypeScript Check (Backend)
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit

      - name: TypeScript Check (Frontend)
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Unit & Integration Tests
        working-directory: backend
        run: npm run test:integration
        timeout-minutes: 10
        continue-on-error: true
        env:
          MONGODB_URI: mongodb://localhost:27017/myworkspace_test
          JWT_SECRET: test-secret-do-not-use-in-production
          NODE_ENV: test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta.outputs.tags }}
      frontend_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/myworkspace-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/myworkspace-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/myworkspace-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/myworkspace-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SSH deploy to the production server is disabled for now.
  # The server is updated outside this pipeline.
  # To re-enable: restore a `deploy` job that SSHes into the server
  # (needs DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY secrets)
  # and a `verify` job gated behind `needs: deploy` (needs DOMAIN).
